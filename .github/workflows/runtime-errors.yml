name: Champion runtime error alerts
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: champion-runtime-errors
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check durable server error signal
        run: node --experimental-strip-types scripts/runtime-check.ts
      - name: Open or recover runtime alert
        if: always() && !cancelled()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          MONITOR_FAILED: ${{ job.status == 'failure' }}
        with:
          script: |
            const title = '[Champion runtime] Server error requires review';
            const marker = '<!-- champion-runtime-errors -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', creator:'github-actions[bot]', per_page:100});
            const existing = issues.find(i => !i.pull_request && i.title === title && i.body?.includes(marker));
            if (process.env.MONITOR_FAILED === 'true') {
              if (!existing) {
                const {data} = await github.rest.issues.create({...context.repo,title,body:[marker,'@TamadTech','A server error, labeled monitoring drill, or unavailable error monitor needs review.',`Run: ${runUrl}`,'The run summary distinguishes the drill flag. Investigate Vercel logs, then acknowledge only the reviewed signal using the private application recovery runbook. Closing this issue alone does not acknowledge the signal. No customer information is included.'].join('\n\n')});
                core.notice(`Runtime alert: ${data.html_url}`);
              } else core.notice(`Existing alert: ${existing.html_url}; duplicate suppressed.`);
            } else if (existing) {
              await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body:`Runtime monitor recovered and no unacknowledged errors remain: ${runUrl}`});
              await github.rest.issues.update({...context.repo,issue_number:existing.number,state:'closed',state_reason:'completed'});
            }
